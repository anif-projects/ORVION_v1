name: LMS Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Install Frontend Dependencies & Test Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Docker Container
        run: |
          docker build -t lms-platform:latest .
